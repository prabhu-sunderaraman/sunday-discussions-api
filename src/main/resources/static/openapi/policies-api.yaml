openapi: 3.0.3
info:
  title: Policy Overview Dashboard API
  description: >-
    BFF (Backend-for-Frontend) API for the APAC Policy Overview Dashboard.
    Aggregates and transforms policy data from the core policy database into a
    frontend-friendly, paginated format for the Angular Material table.

    This document is the source of truth (contract-first).
  version: 1.0.0
  contact:
    name: APAC Operations Engineering
    email: apac-ops-engineering@chubb.com

servers:
  - url: http://localhost:8080
    description: Local development

paths:
  /api/policies:
    get:
      operationId: getPolicies
      summary: List policies
      description: >-
        Returns a paginated list of policies for the dashboard, transformed
        into a frontend-friendly format (display names, expiry indicator).
      tags:
        - Policies
      parameters:
        - name: page
          in: query
          required: false
          description: Zero-based page index.
          schema:
            type: integer
            format: int32
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          description: Maximum number of records per page.
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 10
      responses:
        '200':
          description: A page of policies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPolicyResponse'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The policy service is temporarily unavailable (e.g. the policy
            database is unreachable).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:

    Region:
      type: string
      description: >-
        Human-readable region display name. The API translates the stored
        region code (SG, HK, AU, IN, JP) into these display values.
      enum:
        - Singapore
        - Hong Kong
        - Australia
        - India
        - Japan
      example: Singapore

    PolicyStatus:
      type: string
      description: >-
        Human-readable policy status display value. The API translates the
        stored status (e.g. ACTIVE, LAPSED) into a title-cased display value.
      enum:
        - Active
        - Lapsed
      example: Active

    Money:
      type: object
      description: A monetary amount together with its ISO 4217 currency code.
      required:
        - amount
        - currency
      properties:
        amount:
          type: number
          format: decimal
          description: The monetary value.
          example: 1250.00
        currency:
          type: string
          description: ISO 4217 currency code.
          minLength: 3
          maxLength: 3
          example: SGD

    PolicySummary:
      type: object
      description: A single policy as presented on the dashboard list.
      required:
        - policyNumber
        - holderName
        - region
        - status
        - premium
        - startDate
        - endDate
        - isExpiringSoon
      properties:
        policyNumber:
          type: string
          description: Unique policy identifier.
          example: POL-SG-00012345
        holderName:
          type: string
          description: Full name of the policy holder.
          example: Wei Lin Tan
        region:
          $ref: '#/components/schemas/Region'
        status:
          $ref: '#/components/schemas/PolicyStatus'
        premium:
          $ref: '#/components/schemas/Money'
        startDate:
          type: string
          format: date
          description: Policy start date (ISO 8601, yyyy-MM-dd).
          example: 2025-01-01
        endDate:
          type: string
          format: date
          description: Policy end date (ISO 8601, yyyy-MM-dd).
          example: 2026-01-01
        isExpiringSoon:
          type: boolean
          description: >-
            True when the policy end date is within 30 days from today.
          example: false

    PagedPolicyResponse:
      type: object
      description: >-
        Paginated list of policies, shaped for server-side pagination in an
        Angular Material table.
      required:
        - content
        - page
        - size
        - totalElements
        - totalPages
      properties:
        content:
          type: array
          description: The policies on the current page.
          items:
            $ref: '#/components/schemas/PolicySummary'
        page:
          type: integer
          format: int32
          description: Zero-based index of the current page.
          minimum: 0
          example: 0
        size:
          type: integer
          format: int32
          description: Maximum number of records per page.
          minimum: 1
          example: 10
        totalElements:
          type: integer
          format: int64
          description: Total number of policies across all pages.
          minimum: 0
          example: 137
        totalPages:
          type: integer
          format: int32
          description: Total number of pages available.
          minimum: 0
          example: 14

    ErrorResponse:
      type: object
      description: >-
        Standard error payload. Returned for failures such as the policy
        database being unreachable (503). Never exposes internal stack traces.
      required:
        - timestamp
        - status
        - error
        - message
      properties:
        timestamp:
          type: string
          format: date-time
          description: When the error occurred (ISO 8601).
          example: 2026-06-07T10:15:30Z
        status:
          type: integer
          format: int32
          description: HTTP status code.
          example: 503
        error:
          type: string
          description: Short, human-readable error reason.
          example: Service Unavailable
        message:
          type: string
          description: Readable, non-sensitive description of the problem.
          example: The policy service is temporarily unavailable. Please try again later.
        path:
          type: string
          description: Request path that produced the error.
          example: /api/policies
